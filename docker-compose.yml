services:
  news-scraper:
    image: ghcr.io/daniloreddy/news_scraper:latest
    build: .
    container_name: news-scraper
    restart: unless-stopped
    ports:
      - "8088:8000"       # porta esterna → interna; cambia 8088 se occupata
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # Playwright ha bisogno di /dev/shm abbastanza grande
    shm_size: "512m"