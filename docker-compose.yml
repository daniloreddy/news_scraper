services:
  news-scraper:
    image: ghcr.io/daniloreddy/news_scraper:latest
    container_name: news-scraper
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:${PORT:-8088}"   # host==container, entrambi da PORT
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8088}
    # Playwright ha bisogno di /dev/shm abbastanza grande
    shm_size: "512m"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./debug:/app/debug
