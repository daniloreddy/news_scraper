services:
  news-scraper:
    image: ghcr.io/daniloreddy/news_scraper:latest
    container_name: news-scraper
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8088}:${PORT:-8088}"   # BIND_HOST=0.0.0.0 per LAN / reverse proxy / esposizione diretta
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8088}
      - TZ=${TZ:-UTC}
      # ConfigManager legge/scrive .env qui (vedi volumes). Necessario perché il
      # bind-mount è sulla cartella, non sul singolo file .env: un mount di
      # singolo file impedisce la sostituzione atomica (temp+rename) che
      # ConfigManager usa per scrivere — vedi CLAUDE.md "Config hot reload".
      - ENV_FILE=/app/hostcfg/.env
      # Persiste app.storage.user di NiceGUI (tema dark/light, ecc.) in ./data,
      # già bind-mountato — altrimenti la cartella .nicegui/ di default viene
      # persa a ogni ricreazione del container e il tema torna al default.
      - NICEGUI_STORAGE_PATH=/app/data/.nicegui
    # Playwright ha bisogno di /dev/shm abbastanza grande
    shm_size: "512m"
    volumes:
      # Cartella del progetto (contiene .env accanto a questo compose) — non il
      # singolo file .env, per permettere la scrittura atomica di ConfigManager.
      - .:/app/hostcfg
      - ./data:/app/data
      - ./debug:/app/debug
