services:
  news-scraper:
    image: ghcr.io/daniloreddy/news_scraper:latest
    container_name: news-scraper
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8000"   # porta esterna (APP_PORT in .env) → interna
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # Playwright ha bisogno di /dev/shm abbastanza grande
    shm_size: "512m"
    volumes:
      - ./data:/app/data
      - ./debug:/app/debug
