services:
  news-scraper:
    image: ghcr.io/daniloreddy/news_scraper:latest
    container_name: news-scraper
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:${APP_PORT:-8088}"   # host==container, entrambi da APP_PORT
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_PORT=${APP_PORT:-8088}
    # Playwright ha bisogno di /dev/shm abbastanza grande
    shm_size: "512m"
    volumes:
      - ./data:/app/data
      - ./debug:/app/debug
