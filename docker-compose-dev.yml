services:
  news-scraper:
    build: .
    container_name: news-scraper-dev
    restart: "no"
    ports:
      - "${PORT:-8088}:${PORT:-8088}"   # host==container, entrambi da PORT
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8088}
    shm_size: "512m"
    volumes:
      - ./data:/app/data
      - ./debug:/app/debug
