services:
  news-scraper:
    build: .
    container_name: news-scraper-dev
    restart: "no"
    ports:
      - "${APP_PORT:-8088}:8000"   # porta esterna (APP_PORT in .env) → interna
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    shm_size: "512m"
    volumes:
      - ./data:/app/data
      - ./debug:/app/debug
