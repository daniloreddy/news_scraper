services:
  news-scraper:
    build: .
    container_name: news-scraper-dev
    restart: "no"
    ports:
      - "${PORT:-8088}:${PORT:-8088}"   # host==container, entrambi da PORT
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-8088}
      - TZ=${TZ:-UTC}
      - ENV_FILE=/app/hostcfg/.env
      - NICEGUI_STORAGE_PATH=/app/data/.nicegui
    shm_size: "512m"
    volumes:
      - .:/app/hostcfg
      - ./data:/app/data
      - ./debug:/app/debug
